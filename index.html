const chapters=[
{t:'簿記でいう「現金」の基本',lead:'財布のお金だけが現金、ではない。換金性で判断しよう。',body:`<div class="sectionTitle">まず結論</div><div class="grid2"><div class="card good"><div class="label">✓ 現金に含める</div>紙幣・硬貨／他人振出小切手／送金小切手／郵便為替証書／期限到来済み公社債利札</div><div class="card warn"><div class="label">⚠ 現金に含めない</div>自社振出小切手／郵便切手・収入印紙／期限未到来の利札</div></div><div class="card why"><b>判定軸：</b>「今すぐ、ほぼそのままお金として使えるか？」。他社振出小切手は受取時点で現金扱い。</div>${journal('現金','100,000','売掛金','100,000')} ${quiz('他社振出小切手を受け取った。原則どの勘定？',['現金','当座預金'],0,'受取時は現金。直ちに銀行へ預けた場合は最終的に当座預金。')}`},
{t:'現金と預金の違い',lead:'同じ「お金」でも、手元と銀行口座では勘定科目が変わる。',body:`<div class="grid2"><div class="card"><div class="label">手元</div><strong>現金</strong>：紙幣・硬貨や通貨代用証券など</div><div class="card"><div class="label">銀行</div><strong>預金</strong>：普通預金・当座預金など</div></div><div class="card why">小切手を受け取ってすぐ当座預金へ預けたなら、増えた資産は最終的に当座預金。動きを最後まで追う。</div>${journal('当座預金','100,000','売掛金','100,000')}`},
{t:'現金勘定のしくみ',lead:'現金は資産。増加は借方、減少は貸方。',body:`<div class="grid2"><div class="card good"><b>現金が増える → 借方</b><br>売掛金回収、現金売上など</div><div class="card warn"><b>現金が減る → 貸方</b><br>現金仕入、経費支払など</div></div>${journal('現金','80,000','売上','80,000')}<div class="card why">資産の基本ルール「増えたら借方／減ったら貸方」を現金にもそのまま当てはめる。</div>${quiz('商品を現金30,000円で仕入れた。現金は？',['借方','貸方'],1,'現金という資産が減るので貸方。')}`},
{t:'現金過不足',lead:'帳簿残高と実際有高が合わないときの一時的な受け皿。',body:`<div class="card">帳簿48,000円、実際47,200円 → <strong>800円不足</strong></div>${journal('現金過不足','800','現金','800')}<div class="flow"><span class="pill">差額発見</span><span class="arrow">→</span><span class="pill">現金過不足</span><span class="arrow">→</span><span class="pill">原因判明</span><span class="arrow">→</span><span class="pill">正しい科目へ</span></div><div class="card why" style="margin-top:5px">600円が交通費の記帳漏れ →（借）交通費600／（貸）現金過不足600。残り200円が決算まで不明 → 雑損200。</div>`},
{t:'現金出納帳',lead:'会社版のお小遣い帳。現金の増減を時系列で追う。',body:`<div class="card exam"><b>基本式</b><br>前日残高 ＋ 現金収入 － 現金支出 ＝ 現在残高</div><div class="card">現金出納帳の残高は「帳簿上あるはずの現金」。実査額と違えば現金過不足へ。</div><div class="grid2"><div class="card good">収入欄：現金売上、売掛金回収など</div><div class="card warn">支出欄：仕入、給料、家賃など</div></div>`},
{t:'小口現金',lead:'少額経費専用の財布。定額資金前渡法を理解する。',body:`<div class="flow"><span class="pill">50,000円前渡し</span><span class="arrow">→</span><span class="pill">30,000円支払</span><span class="arrow">→</span><span class="pill">30,000円報告</span><span class="arrow">→</span><span class="pill">30,000円補充</span></div><div class="card good" style="margin-top:5px"><b>「定額」＝補充後の残高を定額へ戻すこと。</b>毎回同額を渡す意味ではない。</div>${quiz('小口現金50,000円のうち30,000円使用。補充額は？',['20,000円','30,000円'],1,'使った30,000円を補充し、手元を50,000円へ戻す。')}`},
{t:'預金と当座預金',lead:'当座預金も資産。小切手決済の中心になる。',body:`<div class="grid2"><div class="card"><b>預け入れ・振込入金</b><br>当座預金の増加 → 借方</div><div class="card"><b>小切手振出・手形決済</b><br>当座預金の減少 → 貸方</div></div>${journal('当座預金','100,000','売掛金','100,000')}<div class="card why">小切手を受け取った瞬間は現金の性質でも、直ちに預ければ「当座預金が増えた」と考える。</div>`},
{t:'小切手完全攻略',lead:'最初の分岐は「誰が振り出した？」。ここが得点源。',body:`<div class="grid2"><div class="card good"><b>他人振出</b><br>原則：現金</div><div class="card warn"><b>自社振出</b><br>現金ではない。当座預金との関係を見る</div></div><div class="card exam"><b>未渡小切手</b>：振出記帳済みでも相手にまだ渡していない。銀行残高はまだ減らない。<br><b>未取付小切手</b>：相手には渡したが銀行へ未呈示。</div>${quiz('自社振出小切手を金庫で発見。現金実査に含める？',['含める','含めない'],1,'自分の口座への支払指図であり、現金そのものではない。')}`},
{t:'当座借越',lead:'残高を超えて小切手を切った不足分は、実質的に銀行借入れ。',body:`<div class="card">当座預金300,000円に対し460,000円の仕入を小切手支払 → 160,000円不足。</div><div class="grid2"><div class="card"><b>一勘定法</b>${journal('仕入','460,000','当座預金','460,000')}</div><div class="card"><b>二勘定法</b>${journal('仕入','460,000','当座預金 300,000<br>当座借越','160,000')}</div></div>`},
{t:'銀行勘定調整表',lead:'会社帳簿と銀行残高のズレを整理する、この回のラスボス。',body:`<div class="card exam"><b>目的：</b>会社残高と銀行残高を、本来あるべき正しい残高へ一致させる。</div><div class="grid2"><div class="card good">会社側の記帳ミス・未記帳 → 原則、仕訳が必要</div><div class="card warn">銀行側の時間差 → 原則、仕訳不要</div></div><div class="card why">「誰の帳簿が間違っている・未反映なのか」を見れば、仕訳要否が判定できる。</div>`},
{t:'不一致6種',lead:'ズレの原因を6パターンに分ければ、調整表は怖くない。',body:`<div class="grid2"><div class="card"><b>①時間外預入</b><br>会社○／銀行まだ</div><div class="card"><b>②未取付小切手</b><br>会社○／銀行まだ</div><div class="card"><b>③銀行手数料</b><br>銀行○／会社まだ</div><div class="card"><b>④取立済み</b><br>銀行○／会社まだ</div><div class="card"><b>⑤会社側記帳誤り</b><br>会社修正</div><div class="card"><b>⑥銀行側誤り</b><br>銀行修正</div></div><div class="card exam">仕訳の必要性は「会社帳簿を直す必要があるか？」で判定。</div>`},
{t:'銀行勘定調整表の設例',lead:'数字を動かして、本来残高へ近づける。',body:`<div class="card">会社残高 520,000円／銀行残高 488,000円。時間外預入40,000、未取付小切手25,000、手数料3,000。</div><div class="grid2"><div class="card good"><b>銀行側</b><br>488,000 + 40,000 - 25,000 = 503,000</div><div class="card warn"><b>会社側</b><br>520,000 - 3,000 = 517,000<br>→ まだ差があるなら他要因を探す</div></div><div class="card why">調整表は「とにかく足し引き」ではなく、各項目がどちら側のズレかを分類してから加減する。</div>`},
{t:'調整表は3つの作り方',lead:'教材では「銀行残高・会社残高区分調整法」を中心に。',body:`<div class="card"><b>①銀行残高を会社残高へ合わせる</b><br><b>②会社残高を銀行残高へ合わせる</b><br><b>③双方を本来残高へ合わせる</b></div><div class="card good"><b>③の利点：</b>会社側の修正事項と銀行側の時間差が分離され、仕訳要否が見やすい。</div>`},
{t:'演習問題攻略',lead:'ここまでの知識をまとめて、実戦判定。',body:`<div class="card exam"><b>現金実査</b><br>紙幣・硬貨28,620／他社振出小切手45,000／自社振出27,000／郵便為替36,500／郵便切手18,350／公社債利札25,000（期限到来15,000）</div><div class="card good"><b>現金有高</b><br>28,620 + 45,000 + 36,500 + 15,000 = <strong>125,120円</strong></div><div class="card warn"><b>未渡小切手50,000円</b><br>費用は発生済みなので消さず、当座預金を戻して未払金へ：<br>（借）当座預金50,000／（貸）未払金50,000</div>`},
{t:'試験直前 10秒判定',lead:'最後は「瞬間判定」できる形に圧縮。',body:`<div class="grid2"><div class="card good"><b>現金？</b><br>紙幣硬貨→○<br>他人振出小切手→○<br>郵便為替→○<br>期限到来利札→○</div><div class="card warn"><b>現金じゃない？</b><br>自社振出小切手→×<br>郵便切手・収入印紙→×<br>期限未到来利札→×</div></div><div class="card exam"><b>銀行調整表</b><br>会社帳簿を直す必要あり → 仕訳あり。銀行側の時間差だけ → 原則仕訳なし。</div>${quiz('金庫内の自社振出小切手27,000円。現金有高に含める？',['含める','含めない'],1,'自社振出は現金ではない。ここは超頻出！')}`}
];
function journal(dl,da,cl,ca){return `<div class="journal"><div class="j"><b>借方</b><div class="jr"><span>${dl}</span><span>${da}</span></div></div><div class="j"><b>貸方</b><div class="jr"><span>${cl}</span><span>${ca}</span></div></div></div>`}
function quiz(q,opts,ans,exp){const id='q'+Math.random().toString(36).slice(2);return `<div class="quizBox" id="${id}"><div class="qtitle">⭐ ミニクイズ｜${q}</div><div class="choices">${opts.map((o,i)=>`<button class="choice" onclick="answer(this,${i},${ans},'${exp.replace(/'/g,"\\'")}')">${String.fromCharCode(65+i)} ${o}</button>`).join('')}</div><div class="feedback"></div></div>`}

function minaVisual(mode){return `<img class="minaPhoto" src="${minaImages[mode]}" alt="ミナ先生" loading="eager" decoding="async">`}
const moods=[['解説モード','ここ、まずは結論からいくよ♡','理由から覚えると忘れにくいよ。'],['考えるモード','「誰のお金？」で整理してみよ♡','仕訳は暗記より関係性。'],['重要ポイント','ここ、試験に出る！指差し確認♡','得点源だから判定軸を固定しよう。'],['注意モード','ひっかけ注意！焦らずいこ♡','似た用語ほど「誰の帳簿？」で区別。'],['正解モード','正解〜！その調子♡','ちゃんと理解が積み上がってるよ。']];
function renderNav(){nav.innerHTML=names.map((n,i)=>`<button class="ch ${i+1===cur?'on':''} ${done.has(i+1)?'done':''}" onclick="go(${i+1})"><i>${i+1}</i>${n}</button>`).join('')}
function setMood(m){const x=moods[m];mood.textContent=x[0];bubble.textContent=x[1];teacherTip.textContent=x[2];const im=document.getElementById('minaPhoto');if(im)im.src=minaImages[m]}
function go(n){cur=Math.max(1,Math.min(15,n));LS.set('minaCur',String(cur));const c=chapters[cur-1];badge.textContent=cur;title.textContent=c.t;lead.textContent=c.lead;content.innerHTML=c.body;content.scrollTop=0;setMood((cur-1)%4);renderNav();progress()}
function markDone(){done.add(cur);LS.set('minaDone',JSON.stringify([...done]));setMood(4);renderNav();progress()}
function next(){markDone();if(cur<15)go(cur+1)}
function progress(){const p=Math.round(done.size/15*100);bar.style.width=p+'%';prog.textContent=done.size+' / 15';pct.textContent=p+'%'}
function answer(btn,pick,ans,exp){const box=btn.closest('.quizBox');box.querySelectorAll('.choice').forEach((b,i)=>b.classList.add(i===ans?'ok':(i===pick?'ng':'')));const f=box.querySelector('.feedback');f.textContent=(pick===ans?'正解！ ':'惜しい！ ')+exp;setMood(pick===ans?4:3);if(pick===ans){done.add(cur);LS.set('minaDone',JSON.stringify([...done]));progress();renderNav()}}
renderNav();go(cur);
</script></body></html>
